<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>キッチンゲーム管理システム</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="title">
                <i class="fas fa-utensils"></i>
                キッチンゲーム管理システム
            </h1>
            <div class="game-controls">
                <button id="startBtn" class="btn btn-primary">
                    <i class="fas fa-play"></i>
                    ゲーム開始
                </button>
                <button id="stopBtn" class="btn btn-secondary" disabled>
                    <i class="fas fa-stop"></i>
                    ゲーム停止
                </button>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="dashboard">
                <!-- ゲームステータス -->
                <section class="status-section">
                    <h2 class="section-title">
                        <i class="fas fa-chart-line"></i>
                        ゲームステータス
                    </h2>
                    <div class="status-grid">
                        <div class="status-card">
                            <div class="status-icon">
                                <i class="fas fa-trophy"></i>
                            </div>
                            <div class="status-content">
                                <h3>成功したレシピ</h3>
                                <span class="status-value" id="successCount">0</span>
                            </div>
                        </div>
                        <div class="status-card">
                            <div class="status-icon waiting">
                                <i class="fas fa-clock"></i>
                            </div>
                            <div class="status-content">
                                <h3>待機中のレシピ</h3>
                                <span class="status-value" id="waitingCount">0</span>
                            </div>
                        </div>
                        <div class="status-card">
                            <div class="status-icon game-status">
                                <i class="fas fa-gamepad"></i>
                            </div>
                            <div class="status-content">
                                <h3>ゲーム状態</h3>
                                <span class="status-value" id="gameStatus">停止中</span>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- プログレスバー -->
                <section class="progress-section">
                    <h2 class="section-title">
                        <i class="fas fa-tasks"></i>
                        レシピ進行状況
                    </h2>
                    <div class="progress-container">
                        <div class="progress-bar">
                            <div class="progress-fill" id="progressFill"></div>
                        </div>
                        <div class="progress-text">
                            <span id="progressText">0 / 10 レシピ完了</span>
                            <span id="progressPercentage">0%</span>
                        </div>
                    </div>
                </section>

                <!-- 待機中のレシピ -->
                <section class="recipes-section">
                    <h2 class="section-title">
                        <i class="fas fa-list"></i>
                        待機中のレシピ
                    </h2>
                    <div class="recipes-container" id="waitingRecipes">
                        <div class="empty-state">
                            <i class="fas fa-coffee"></i>
                            <p>待機中のレシピはありません</p>
                        </div>
                    </div>
                </section>

                <!-- 配達テスト -->
                <section class="delivery-section">
                    <h2 class="section-title">
                        <i class="fas fa-shipping-fast"></i>
                        レシピ配達テスト
                    </h2>
                    <div class="delivery-container">
                        <div class="ingredients-selector">
                            <h3>材料を選択</h3>
                            <div class="ingredients-grid">
                                <label class="ingredient-item">
                                    <input type="checkbox" value="Bread">
                                    <div class="ingredient-card">
                                        <i class="fas fa-bread-slice"></i>
                                        <span>パン</span>
                                    </div>
                                </label>
                                <label class="ingredient-item">
                                    <input type="checkbox" value="Lettuce">
                                    <div class="ingredient-card">
                                        <i class="fas fa-leaf"></i>
                                        <span>レタス</span>
                                    </div>
                                </label>
                                <label class="ingredient-item">
                                    <input type="checkbox" value="Tomato">
                                    <div class="ingredient-card">
                                        <i class="fas fa-apple-alt"></i>
                                        <span>トマト</span>
                                    </div>
                                </label>
                                <label class="ingredient-item">
                                    <input type="checkbox" value="Cheese">
                                    <div class="ingredient-card">
                                        <i class="fas fa-cheese"></i>
                                        <span>チーズ</span>
                                    </div>
                                </label>
                            </div>
                            <button id="deliverBtn" class="btn btn-success">
                                <i class="fas fa-truck"></i>
                                配達する
                            </button>
                        </div>
                    </div>
                </section>

                <!-- 履歴表示 -->
                <section class="history-section">
                    <h2 class="section-title">
                        <i class="fas fa-history"></i>
                        ゲーム履歴
                    </h2>
                    <div class="history-container" id="gameHistory">
                        <div class="empty-state">
                            <i class="fas fa-clock"></i>
                            <p>履歴がありません</p>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 キッチンゲーム管理システム - GitHub Copilot Workshop</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
