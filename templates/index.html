<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ポモドーロタイマー</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1 class="title">🍅 ポモドーロタイマー</h1>
        <div class="circle-timer">
            <span id="timer">25:00</span>
        </div>
        <div class="buttons">
            <button id="start" class="circle-btn start">▶</button>
            <button id="stop" class="circle-btn stop">■</button>
            <button id="reset" class="circle-btn reset">⟳</button>
        </div>
        <div class="label-row">
            <span class="label work">作業</span>
            <span class="label break">休憩</span>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
